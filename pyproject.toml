[project]
name = "laser-jig"
version = "0.1.2"
description = "3D-printable laser-engraving jigs (STL) and matching SVG alignment templates from a CSV of blank sizes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "build123d>=0.13",
]
keywords = ["laser-engraving", "jig", "3d-printing", "stl", "svg", "cad", "cli"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics :: 3D Modeling"]

[project.scripts]
laser-jig = "laser_jig.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laser_jig"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
